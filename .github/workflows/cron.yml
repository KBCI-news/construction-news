name: News Collection Cron

on:
  schedule:
    # 30분마다 (UTC 기준이지만 30분 간격은 시간대 무관)
    - cron: "*/30 * * * *"
  workflow_dispatch: # 수동 트리거 허용

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect articles
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/collect"

      # 수집 직후 클러스터링·중요도 채점을 서버에서 일괄 수행한다
      - name: Score and cluster
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/score"

      # 지표 원본 — 한국은행 ECOS에서 통계를 직접 받아온다.
      # ECOS_API_KEY가 없으면 즉시 skip 응답이라 실패하지 않는다.
      - name: Sync official indicators (ECOS)
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/ecos"

      # 지표 원본 — 금감원 FISIS에서 연체율 통계를 직접 받아온다.
      # FISIS_API_KEY가 없거나 확정된 계열이 없으면 즉시 skip.
      - name: Sync official indicators (FISIS)
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/fisis"

      # 지표 시계열 — 30일 아카이브를 훑어 추이 데이터를 채운다
      # (기관 통계가 있는 지표는 건너뛴다)
      - name: Backfill indicator history
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/indicators"
