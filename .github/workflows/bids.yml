name: Bid Notice Cron

on:
  schedule:
    # 30분 간격 두 줄. 정각(:00)은 GitHub Actions 큐가 가장 붐벼 수십 분씩 밀리므로
    # 비켜 둔다. 스케줄이 실제로는 2~6시간씩 밀리는 날이 많아(14일간 41% 미커버)
    # 서버가 지난 회차 창 끝에 이어 붙여 빈틈을 메운다(최대 12시간).
    - cron: "5 * * * *"
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "소급 수집 시간(기본 3, 최대 720)"
        required: false
        type: string

jobs:
  bids:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 나라장터(조달청) 입찰공고 — 문서 전자화·전자문서 보관·임대차조사·권리조사.
      # G2B_SERVICE_KEY가 없으면 즉시 skip 응답이라 실패하지 않는다.
      - name: Collect bid notices
        env:
          HOURS: ${{ inputs.hours }}
        run: |
          QS=""
          if [ -n "$HOURS" ]; then QS="?hours=$HOURS"; fi
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/bids${QS}"
