<script>
(function () {
  "use strict";
  const DATA = window.__DATA__;
  const FONT = '"IBM Plex Sans KR","KBFG","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
  const INK = "#111827", INK2 = "#4b5563", MUTED = "#6b7280";

  // 색 — 태그별 한 색상의 밝기 단계. 칸 위 글자는 항상 잉크색(색 위 글자 대비 ≥ 7:1).
  const HUES = {
    yellow: { name: "KB 옐로", ink: "#7A5E08", t0: "#FFB81C", t1: "#FFD873", t2: "#FFEBB8", bg: "#FFF6DC", edge: "#F3D98A" },
    blue:   { name: "블루",   ink: "#1C5CAB", t0: "#9CC4F2", t1: "#C5DCF8", t2: "#E3EEFC", bg: "#F0F6FE", edge: "#BBD4F2" },
    aqua:   { name: "그린",   ink: "#0B6B4A", t0: "#95DFC2", t1: "#C2ECDB", t2: "#E2F6ED", bg: "#F0FAF5", edge: "#B6E4CF" },
    violet: { name: "바이올렛", ink: "#3F2F96", t0: "#C2BAEC", t1: "#DAD5F4", t2: "#ECEAF9", bg: "#F4F2FB", edge: "#CFC9EE" },
    brown:  { name: "KB 브라운", ink: "#5C4300", t0: "#D4C08F", t1: "#E5D9B9", t2: "#F1EBDB", bg: "#F7F4EC", edge: "#DDD0AC" },
    red:    { name: "레드",   ink: "#A32D2D", t0: "#F5B3B2", t1: "#F9D0CF", t2: "#FCE6E6", bg: "#FDF1F1", edge: "#F2C6C5" },
    gray:   { name: "그레이", ink: "#4B5563", t0: "#D1D5DB", t1: "#E2E5EA", t2: "#EEF0F3", bg: "#F6F7F9", edge: "#D5D9E0" },
  };

  const fmt = (n) => (n == null ? "" : Number(n).toLocaleString("ko-KR"));
  const PRINT_PARAM = /[?&]print=1/.test(location.search);
  const isPrint = () => PRINT_PARAM || (window.matchMedia && window.matchMedia("print").matches);

  // ---- 글자 폭 측정 (칸에 들어갈 때만 라벨을 그린다) ----
  const ctx = document.createElement("canvas").getContext("2d");
  function tw(text, size, weight) {
    ctx.font = `${weight} ${size}px ${FONT}`;
    return ctx.measureText(text).width;
  }

  // ---- 머리글·주석 ----
  const M = DATA.meta;
  const dateKo = (s) => s.replace(/-/g, ".");
  document.getElementById("subtitle").textContent =
    `최근 30일 (${dateKo(M.from)} ~ ${dateKo(M.to)}) · 수집 기사 ${fmt(M.total)}건 · 키워드 매칭 기사 ${fmt(M.matched)}건 · 태그 부여 기사 ${fmt(M.taggedDesks)}건`;

  const groups = DATA.tree.children;
  const legendTags = document.getElementById("legend-tags");
  for (const g of groups) {
    const h = HUES[g.hue];
    const el = document.createElement("span");
    el.className = "lg-item";
    el.innerHTML = `<span class="sw" style="background:${h.t0};border-color:${h.ink}" aria-hidden="true"></span>${g.label}`;
    legendTags.appendChild(el);
  }

  document.getElementById("note").innerHTML =
    `<b>읽는 법</b> 태그 머리글의 기사 수는 데스크 판정을 통과해 태그가 붙은 기사 수, 칸의 매칭 수는 제목·요약에 그 키워드가 등장한 대표기사 수(태그 판정 전)입니다. ` +
    `법/정책은 데스크가 아니라 사건종류(감독·제재 / 입법·개정 / 판결)로 붙는 태그라 노동 법제 키워드와 <b>사건종류 판정어</b>를 함께 두었고, 판정어의 수는 법/정책 기사 ${fmt(M.legalTagged)}건 안에서 센 값입니다. ` +
    `감독기관명(금융위원회·금융감독원 등)은 발신 주체 신호로만 쓰여 태그 판정에서 빠집니다. ` +
    `매칭이 극히 적은 태그(신용정보업권)는 머리글이 보이도록 배치 면적에만 최소치(전체의 1.2%)를 두었고, 숫자는 실제 값입니다. 칸에 글자가 없으면 눌러서(또는 마우스를 올려) 확인하세요.`;
  document.getElementById("foot").textContent =
    `자료: KBCI 뉴스룸 DB (articles, 대표기사·is_rep 기준, ${M.queriedAt.replace("T", " ")} 조회) · 키워드 사전: src/lib/lexicon.ts`;

  // ---- 계층 ----
  // floorFrac: 매칭이 극히 적은 태그 묶음이 머리글도 못 보일 만큼 작아지지 않도록 묶음 면적에 최소치를 둔다
  // (배치에만 쓰고, 표시되는 숫자는 실제 값 그대로. 주석에 밝힌다)
  function hierarchy(data, floorFrac) {
    const root = d3.hierarchy(data, (d) => d.children)
      .sum((d) => (d.children ? 0 : Math.max(d.n, 1)));
    if (floorFrac && root.children) {
      const floorV = root.value * floorFrac;
      for (const c of root.children) {
        if (!c.data.muted && c.value < floorV) {
          const k = floorV / c.value;
          c.each((n) => { n.value *= k; });
          c.data.floored = true;
        }
      }
      root.value = d3.sum(root.children, (c) => c.value);
    }
    return root.sort((a, b) => b.value - a.value);
  }
  const hueOf = (node) => {
    let n = node;
    while (n && !(n.data && n.data.hue)) n = n.parent;
    return HUES[(n && n.data.hue) || "gray"];
  };
  const groupOf = (node) => {
    let n = node;
    while (n && n.data.level !== "group") n = n.parent;
    return n;
  };

  // 루트: 태그 묶음은 위쪽에 스쿼리파이, 태그 밖(muted)은 같은 축척으로 아래 띠에.
  function rootTile(node, x0, y0, x1, y1) {
    const main = node.children.filter((c) => !c.data.muted);
    const side = node.children.filter((c) => c.data.muted);
    const sideV = d3.sum(side, (c) => c.value);
    const sideH = (y1 - y0) * (sideV / node.value);
    d3.treemapSquarify({ children: main, value: node.value - sideV }, x0, y0, x1, y1 - sideH);
    let xx = x0;
    for (const c of side) {
      const w = (x1 - x0) * (c.value / sideV);
      c.x0 = xx; c.x1 = xx + w; c.y0 = y1 - sideH; c.y1 = y1;
      xx += w;
    }
  }
  const PAD_TOP = { group: 28, sub: 22 };
  function layout(root, W, H) {
    d3.treemap()
      .size([W, H])
      .tile((n, x0, y0, x1, y1) => (n.data.level === "root" ? rootTile(n, x0, y0, x1, y1) : d3.treemapSquarify(n, x0, y0, x1, y1)))
      .paddingInner((d) => (d.data.level === "root" ? 6 : 2))
      .paddingOuter((d) => (d.data.level === "root" ? 0 : 3))
      .paddingTop((d) => (d.data.level === "root" ? 0 : PAD_TOP[d.data.level]))
      (root);
    return root;
  }

  // ---- 그리기 ----
  function leafFill(d, h) {
    if (d.data.n === 0) return "#ffffff";
    if (d.data.act || d.data.authOnly) return h.t1;
    return d.data.tier === 0 ? h.t0 : d.data.tier === 1 ? h.t1 : h.t2;
  }
  function tierLabel(d) {
    if (d.data.act) return `사건종류 판정어 · ${d.data.kindLabel} (${d.data.grade})`;
    if (d.data.authOnly) return `T${d.data.tier} · 발신 주체 신호 (태그 판정 제외)`;
    return d.data.tier === 0 ? "T0 핵심" : `T${d.data.tier}`;
  }
  function ariaLabel(d) {
    const g = groupOf(d);
    return `${g.data.label}: ${d.data.term}, 최근 30일 매칭 ${fmt(d.data.n)}건, ${tierLabel(d)}${d.data.query ? ", 네이버 수집 쿼리" : ""}`;
  }

  function draw(container, root, W, H) {
    const svg = d3.create("svg")
      .attr("viewBox", `0 0 ${W} ${H}`)
      .attr("width", W).attr("height", H)
      .attr("font-family", FONT)
      .attr("role", "group");
    const nodes = root.descendants().filter((d) => d.data.level !== "root");
    const w = (d) => Math.max(0, d.x1 - d.x0);
    const hgt = (d) => Math.max(0, d.y1 - d.y0);
    const overlay = svg.append("g").attr("class", "overlay"); // 칸 위에 얹는 세로 머리글 — 마지막에 맨 위로 올린다

    // 묶음(태그 / 하위 묶음) 바탕
    const conts = nodes.filter((d) => d.children);
    const cg = svg.append("g").selectAll("g").data(conts).join("g");
    cg.append("rect")
      .attr("x", (d) => d.x0).attr("y", (d) => d.y0)
      .attr("width", w).attr("height", hgt)
      .attr("rx", (d) => (d.data.level === "group" ? 6 : 4))
      .attr("fill", (d) => (d.data.level === "group" ? hueOf(d).bg : "rgba(255,255,255,0.6)"))
      .attr("stroke", (d) => (d.data.level === "group" ? hueOf(d).edge : "none"))
      .attr("stroke-width", 1);

    // 묶음 머리글 — 들어갈 때만, 이름 → 이름+건수 순으로
    cg.each(function (d) {
      const h = hueOf(d);
      const isG = d.data.level === "group";
      const size = isG ? 14 : 12;
      const avail = w(d) - 14;
      if (hgt(d) < PAD_TOP[d.data.level] - 2 || w(d) < 18) return;
      const name = d.data.label;
      const cnt = d.data.total != null ? `${d.data.totalLabel} ${fmt(d.data.total)}건` : (d.data.totalLabel || "");
      const nameW = tw(name, size, 700);
      const t = d3.select(this).append("text")
        .attr("x", d.x0 + 8).attr("y", d.y0 + (isG ? 19 : 16))
        .attr("fill", h.ink).attr("font-size", size).attr("font-weight", 700);
      if (avail >= 20 && nameW <= avail) {
        t.append("tspan").text(name);
        // 이름 → 건수 → 짧은 설명 순으로, 들어가는 데까지만
        let used = nameW;
        for (const [txt, wgt] of [[cnt, 500], [d.data.note, 500]]) {
          if (!txt) continue;
          const tw_ = tw(txt, 12, wgt);
          if (used + 10 + tw_ > avail) break;
          t.append("tspan").attr("dx", 10).attr("font-size", 12).attr("font-weight", wgt).text(txt);
          used += 10 + tw_;
        }
      } else {
        // 짧은 이름으로 (괄호 앞까지) → 그래도 안 들어가는 좁고 긴 묶음은 세로로
        const short = name.replace(/\s*\(.*$/, "");
        if (tw(short, size, 700) <= avail) { t.append("tspan").text(short); return; }
        t.remove();
        const vs = 12, chars = [...short.replace(/\s+/g, "")], adv = vs + 2, bw = vs + 6;
        if (w(d) >= bw + 2 && hgt(d) >= chars.length * adv + 14) {
          const gsel = overlay;
          const bx = d.x0 + (w(d) - bw) / 2;
          gsel.append("rect").attr("x", bx).attr("y", d.y0 + 3).attr("rx", 3)
            .attr("width", bw).attr("height", chars.length * adv + 8).attr("fill", h.bg).attr("opacity", 0.94);
          const vt = gsel.append("text").attr("text-anchor", "middle").attr("fill", h.ink).attr("font-size", vs).attr("font-weight", 700);
          chars.forEach((c, i) => vt.append("tspan").attr("x", bx + bw / 2).attr("y", d.y0 + 5 + adv * (i + 1) - 2).text(c));
        }
      }
    });

    // 칸(키워드)
    const leaves = nodes.filter((d) => !d.children);
    const lg = svg.append("g").selectAll("g").data(leaves).join("g")
      .attr("class", "leaf")
      .attr("tabindex", 0)
      .attr("role", "img")
      .attr("aria-label", ariaLabel);
    lg.append("rect")
      .attr("x", (d) => d.x0).attr("y", (d) => d.y0)
      .attr("width", w).attr("height", hgt)
      .attr("rx", 3)
      .attr("fill", (d) => leafFill(d, hueOf(d)))
      .attr("stroke", (d) => {
        const tiny = w(d) < 10 || hgt(d) < 10; // 아주 작은 칸은 테두리를 빼 사다리 무늬를 막는다
        if (d.data.subtag) return hueOf(d).ink;
        return d.data.n === 0 && !tiny ? hueOf(d).edge : "none";
      })
      .attr("stroke-width", (d) => (d.data.subtag ? (w(d) < 12 || hgt(d) < 12 ? 1 : 2.5) : 1));

    // 이름을 칸 너비에 맞춰 줄로 나눈다. 1줄 → 균형 잡힌 2줄 → 3줄(탐욕) 순. 못 맞추면 null.
    function wrapName(name, avail, size, weight, maxLines) {
      if (tw(name, size, weight) <= avail) return [name];
      if (maxLines < 2) return null;
      const ch = [...name];
      let best = null;
      for (let i = 1; i < ch.length; i++) {
        const a = ch.slice(0, i).join("").trim(), b = ch.slice(i).join("").trim();
        if ([...a].length < 2 || [...b].length < 2) continue; // 한 글자짜리 줄은 만들지 않는다
        const wa = tw(a, size, weight), wb = tw(b, size, weight);
        if (wa > avail || wb > avail) continue;
        const score = Math.max(wa, wb) - (ch[i] === " " || ch[i - 1] === " " ? 20 : 0);
        if (!best || score < best.score) best = { score, lines: [a, b] };
      }
      if (best) return best.lines;
      if (maxLines < 3) return null;
      const lines = []; let cur = "";
      for (const c of ch) {
        if (tw(cur + c, size, weight) <= avail) { cur += c; continue; }
        if (!cur) return null;
        lines.push(cur.trim()); cur = c === " " ? "" : c;
        if (lines.length > 3) return null;
      }
      if (cur.trim()) lines.push(cur.trim());
      if (lines.length > 3 || lines.some((l) => [...l].length < 2)) return null;
      return lines;
    }

    lg.each(function (d) {
      const W_ = w(d), H_ = hgt(d);
      const pad = 6;
      if (W_ < pad * 2 + 12 || H_ < 18) return;
      const zero = d.data.n === 0;
      const fill = zero ? MUTED : INK;
      const weight = d.data.tier === 0 && !zero ? 700 : 600;
      const name = d.data.term;
      const lineH = (s) => Math.round(s * 1.25);
      // 큰 칸은 15px, 보통 13px, 최소 12px — 못 맞추면 한 단계 작게
      const big = W_ >= 150 && H_ >= 72;
      const tryFit = (dotW, topOff) => {
        for (const s of big ? [15, 13, 12] : [13, 12]) {
          const ml = Math.min(3, Math.floor((H_ - pad * 2 - topOff) / lineH(s)));
          if (ml < 1) continue;
          const ls = wrapName(name, W_ - pad * 2 - dotW, s, weight, ml);
          if (ls) return { lines: ls, size: s, dotW, topOff };
        }
        return null;
      };
      // 수집 쿼리 점(●)은 글 앞에, 폭이 모자라면 글 위에 따로 둔다
      let fit = tryFit(d.data.query ? 11 : 0, 0);
      if (!fit && d.data.query) fit = tryFit(0, 9);
      const g = d3.select(this);
      if (!fit) {
        // 세로로 긴 칸: 글자를 한 자씩 세로로 쌓는다 (한글은 세워 써도 그대로 읽힌다)
        const vs = 13, adv = vs + 1, dotH = d.data.query ? 9 : 0;
        const chars = [...name.replace(/\s+/g, "")];
        const needH = chars.length * adv + pad * 2 + dotH;
        if (W_ >= vs + pad * 2 && H_ >= needH && chars.length >= 2) {
          const cx = d.x0 + Math.min(W_ / 2, pad + vs * 0.5 + 1);
          const top = d.y0 + pad;
          if (d.data.query) g.append("circle").attr("cx", cx).attr("cy", top + 3.5).attr("r", 3.2).attr("fill", INK2);
          const t = g.append("text").attr("text-anchor", "middle")
            .attr("fill", fill).attr("font-size", vs).attr("font-weight", weight);
          chars.forEach((c, i) => t.append("tspan").attr("x", cx).attr("y", top + dotH + adv * (i + 1) - 2).text(c));
        }
        return; // 그래도 안 들어가면 라벨 없이 (툴팁·표에서 확인)
      }
      const { lines, size, dotW, topOff } = fit;
      let y = d.y0 + pad + topOff + size * 0.92;
      if (d.data.query) {
        if (dotW) g.append("circle").attr("cx", d.x0 + pad + 4).attr("cy", y - size * 0.33).attr("r", 3.2).attr("fill", INK2);
        else g.append("circle").attr("cx", d.x0 + pad + 3.5).attr("cy", d.y0 + pad + 3.5).attr("r", 3.2).attr("fill", INK2);
      }
      const t = g.append("text").attr("x", d.x0 + pad + dotW).attr("y", y)
        .attr("fill", fill).attr("font-size", size).attr("font-weight", weight);
      lines.forEach((ln, i) => {
        t.append("tspan").attr("x", d.x0 + pad + (i === 0 ? dotW : 0)).attr("dy", i === 0 ? 0 : lineH(size)).text(ln);
      });
      y += lineH(size) * (lines.length - 1);
      // 마지막 줄: 건수 (+ 짧은 부가 정보)
      const l2Size = Math.max(12, size - 2);
      if (d.y1 - pad >= y + l2Size + 4) {
        let l2 = `${fmt(d.data.n)}건`;
        const extra = d.data.subtag ? "소태그" : d.data.act ? d.data.kindLabel : d.data.authOnly ? "발신주체" : d.data.tier === 0 && !zero ? "핵심" : "";
        const availL2 = W_ - pad * 2;
        if (extra && tw(`${l2} · ${extra}`, l2Size, 500) <= availL2) l2 = `${l2} · ${extra}`;
        if (tw(l2, l2Size, 500) <= availL2) {
          g.append("text").attr("x", d.x0 + pad).attr("y", y + l2Size + 4)
            .attr("fill", zero ? MUTED : INK2).attr("font-size", l2Size).attr("font-weight", 500).text(l2);
        }
      }
    });

    // 툴팁 (마우스 올림 / 탭 / 키보드 포커스)
    lg.on("pointerenter", (ev, d) => { if (ev.pointerType === "mouse") showTip(d, ev.clientX, ev.clientY); })
      .on("pointermove", (ev, d) => { if (ev.pointerType === "mouse" && !pinned) showTip(d, ev.clientX, ev.clientY); })
      .on("pointerleave", () => { if (!pinned) hideTip(); })
      .on("focus", function (ev, d) { const r = this.getBoundingClientRect(); showTip(d, r.left + r.width / 2, r.top + r.height / 2); })
      .on("blur", () => { if (!pinned) hideTip(); })
      .on("click", (ev, d) => {
        ev.stopPropagation();
        if (pinned === d) { pinned = null; hideTip(); return; }
        pinned = d; showTip(d, ev.clientX, ev.clientY);
      });

    svg.node().appendChild(overlay.node());
    container.appendChild(svg.node());
  }

  // ---- 툴팁 ----
  const tip = document.getElementById("tip");
  let pinned = null;
  function showTip(d, cx, cy) {
    const g = groupOf(d), h = hueOf(d);
    const meta = [];
    meta.push(tierLabel(d));
    if (d.data.query) meta.push("● 네이버 수집 쿼리");
    if (d.data.requires) meta.push("문맥 필수어 있음");
    if (d.data.subtag) meta.push("KB금융 소태그");
    const sub = d.parent && d.parent.data.level === "sub" ? ` · ${d.parent.data.label.replace(/\s*\(.*$/, "")}` : "";
    const nText = d.data.act ? `법/정책 기사 ${fmt(M.legalTagged)}건 중 <b>${fmt(d.data.n)}</b>건에 등장` : `최근 30일 매칭 <b>${fmt(d.data.n)}</b>건`;
    tip.innerHTML =
      `<span class="tip-tag" style="background:${h.t1};color:${h.ink}">${g.data.label}${sub}</span>` +
      `<div class="tip-term">${d.data.term}</div>` +
      `<div class="tip-n">${nText}</div>` +
      `<div class="tip-meta">${meta.join(" · ")}</div>`;
    tip.hidden = false;
    const vw = window.innerWidth, vh = window.innerHeight;
    const r = tip.getBoundingClientRect();
    let x = cx + 14, y = cy + 14;
    if (x + r.width > vw - 8) x = Math.max(8, cx - r.width - 14);
    if (y + r.height > vh - 8) y = Math.max(8, cy - r.height - 14);
    tip.style.left = `${x}px`; tip.style.top = `${y}px`;
  }
  function hideTip() { tip.hidden = true; }
  document.addEventListener("click", () => { pinned = null; hideTip(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { pinned = null; hideTip(); } });

  // ---- 렌더 (데스크톱·인쇄 = 트리맵 하나 / 모바일 = 태그별로 쌓기) ----
  const mapEl = document.getElementById("map");
  let lastKey = "";
  function render(force) {
    if (!window.d3) {
      mapEl.innerHTML = '<div class="card fallback">그래프 라이브러리(d3)를 불러오지 못했습니다. 네트워크 연결을 확인한 뒤 새로고침해 주세요. 아래 표에서 같은 내용을 볼 수 있습니다.</div>';
      return;
    }
    const print = isPrint();
    const cw = mapEl.clientWidth || document.documentElement.clientWidth;
    const stacked = !print && cw < 760;
    const key = `${print ? "p" : stacked ? "s" : "d"}:${cw}`;
    if (!force && key === lastKey) return;
    lastKey = key;
    pinned = null; hideTip();
    mapEl.innerHTML = "";

    if (stacked) {
      const W = cw - 20;
      const grand = d3.sum(groups, (g) => hierarchy(g).value);
      for (const g of groups) {
        const card = document.createElement("div");
        card.className = "card stack";
        card.style.padding = "10px";
        const root = hierarchy(g);
        // 세로 길이는 매칭 수에 비례 (최소 170px, 최대 820px)
        const H = Math.round(Math.min(820, Math.max(170, (root.value / grand) * 3200)));
        draw(card, layout(root, W, H), W, H);
        mapEl.appendChild(card);
      }
      return;
    }
    const card = document.createElement("div");
    card.className = "card";
    const W = print ? Math.min(cw, 1062) - 12 : cw - 24;
    const H = print ? 556 : Math.round(W * 0.6);
    draw(card, layout(hierarchy(DATA.tree, 0.012), W, H), W, H);
    mapEl.appendChild(card);
  }

  // ---- 표 (그래프의 쌍둥이 — 모든 값은 여기서도 읽힌다) ----
  function buildTable() {
    const body = document.getElementById("tbl-body");
    let total = 0;
    const rows = (leavesArr, h) => {
      const sorted = [...leavesArr].sort((a, b) => b.n - a.n || a.term.localeCompare(b.term, "ko"));
      total += sorted.length;
      return `<table><thead><tr><th>키워드</th><th class="num">매칭</th><th>등급</th><th>비고</th></tr></thead><tbody>` +
        sorted.map((d) => {
          const grade = d.act ? `판정어 · ${d.kindLabel}` : d.authOnly ? `T${d.tier} · 발신주체` : d.tier === 0 ? "T0 핵심" : `T${d.tier}`;
          const note = [d.subtag ? "소태그" : "", d.requires ? "문맥 필수어" : "", d.act ? d.grade : ""].filter(Boolean).join(" · ");
          return `<tr><td>${d.query ? '<span class="q" title="네이버 수집 쿼리"></span>' : ""}${d.term}</td>` +
            `<td class="num${d.n === 0 ? " zero" : ""}">${fmt(d.n)}</td><td>${grade}</td><td>${note}</td></tr>`;
        }).join("") + `</tbody></table>`;
    };
    let html = "";
    for (const g of groups) {
      const h = HUES[g.hue];
      const tot = g.total != null ? `<small>${g.totalLabel} ${fmt(g.total)}건</small>` : "";
      html += `<h3><span class="sw" style="background:${h.t0};border-color:${h.ink}" aria-hidden="true"></span>${g.label} ${tot}</h3>`;
      const subs = g.children.filter((c) => c.level === "sub");
      if (subs.length) {
        for (const s of subs) {
          const st = s.total != null ? ` · ${s.totalLabel} ${fmt(s.total)}건` : "";
          html += `<h4>${s.label}${st}</h4>` + rows(s.children, h);
        }
      } else {
        html += rows(g.children, h);
      }
    }
    body.innerHTML = html;
    document.getElementById("tbl-summary").textContent = `전체 키워드 표 보기 (${fmt(total)}개 · 태그별 매칭 수 · 등급 · 수집 여부)`;
  }

  buildTable();
  if (PRINT_PARAM) document.getElementById("tbl").open = true;
  render(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(true));
  let rt = null;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => render(false), 120); });
  window.addEventListener("beforeprint", () => { document.getElementById("tbl").open = true; render(true); });
  window.addEventListener("afterprint", () => render(true));
})();
</script>
</body>
</html>
